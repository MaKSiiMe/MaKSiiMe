name: Update profile README (activity + stars)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"  # 05:00 UTC daily (~07:00 Europe/Paris)

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    env:
      TARGET_USERNAME: ${{ github.repository_owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build sections with GitHub API (clean formatting & robust replacement)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // --- Resolve README filename regardless of casing ---
            const candidates = ['README.md','Readme.md','README.MD','readme.md'];
            let readmePath = null;
            for (const p of candidates) {
              if (fs.existsSync(p)) { readmePath = p; break; }
            }
            if (!readmePath) {
              core.setFailed('README file not found (tried: ' + candidates.join(', ') + ')');
              process.exit(1);
            }
            let md = fs.readFileSync(readmePath, 'utf8');

            // --- Helpers for flexible markers ---
            function ensureSection(tag, title) {
              const startRe = new RegExp(`<!--\s*${tag}\s*:\s*START\s*-->`, 'i');
              const endRe   = new RegExp(`<!--\s*${tag}\s*:\s*END\s*-->`, 'i');
              const hasStart = startRe.test(md);
              const hasEnd   = endRe.test(md);
              if (!hasStart || !hasEnd) {
                md += `\n\n## ${title}\n<!-- ${tag}:START -->\n<!-- ${tag}:END -->\n`;
              }
              return { startRe, endRe };
            }

            const act = ensureSection('ACTIVITY', '🔄 Latest activity');
            const star = ensureSection('STARS', '⭐ Recently starred');

            // --- Utilities ---
            function fmtDate(iso) { return iso ? iso.split('T')[0] : ''; }
            const username = process.env.TARGET_USERNAME || context.repo.owner;

            // --- Friendly labels for event types ---
            const typeIcon = {
              WatchEvent: '👀 Watched',
              CreateEvent: '🆕 Created',
              PushEvent: '📤 Pushed',
              ForkEvent: '🍴 Forked',
              IssuesEvent: '🐞 Issue',
              IssueCommentEvent: '💬 Issue comment',
              PullRequestEvent: '🔀 PR',
              PullRequestReviewEvent: '📝 PR review',
              ReleaseEvent: '🏷️ Release',
              PublicEvent: '🌐 Public'
            };

            // --- Fetch data ---
            const { data: eventsRaw } = await github.rest.activity.listPublicEventsForUser({
              username,
              per_page: 10
            }).catch(() => ({ data: [] }));

            const events = (eventsRaw || []).slice(0, 3).map(e => {
              const date = fmtDate(e.created_at);
              const repo = e.repo ? e.repo.name : '';
              const url = repo ? `https://github.com/${repo}` : '';
              const label = typeIcon[e.type] || e.type || 'Event';
              return `- 📅 ${date} — ${label} [${repo}](${url})`;
            });

            const { data: starsRaw } = await github.rest.activity.listReposStarredByUser({
              username,
              per_page: 10
            }).catch(() => ({ data: [] }));

            const stars = (starsRaw || []).slice(0, 3).map(s => {
              const r = s.repo || s;
              const full = r.full_name || (r.owner?.login && r.name ? `${r.owner.login}/${r.name}` : '');
              const desc = (r.description || '').replace(/\r?\n/g, ' ').trim();
              return desc
                ? `- ⭐ [${full}](https://github.com/${full}) — ${desc}`
                : `- ⭐ [${full}](https://github.com/${full})`;
            });

            const activity = events.length ? events.join('\n') : '- No recent public activity.';
            const starred  = stars.length ? stars.join('\n') : '- No recent stars.';

            // --- Replace content between markers; re-find markers each time to avoid stale indices ---
            function replaceBetween(tagRePair, newContent) {
              const { startRe, endRe } = tagRePair;
              const startMatch = md.match(startRe);
              const endMatch = md.match(endRe);
              if (!startMatch || !endMatch) {
                core.setFailed('Markers missing at replacement time.');
                process.exit(1);
              }
              const startIdx = startMatch.index + startMatch[0].length;
              const endIdx = endMatch.index;
              md = md.slice(0, startIdx) + "\n" + newContent + "\n" + md.slice(endIdx);
            }

            replaceBetween(act, activity);
            replaceBetween(star, starred);

            fs.writeFileSync(readmePath, md);

      - name: Commit & push if changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(readme): clean activity & stars formatting (robust markers)"
            git push
          else
            echo "No changes to commit."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
