name: Update profile README (activity + stars)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"  # 05:00 UTC daily (~07:00 Europe/Paris)

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    env:
      TARGET_USERNAME: ${{ github.repository_owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build sections with GitHub API (robust markers)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // --- Resolve README filename regardless of casing ---
            const candidates = ['README.md','Readme.md','README.MD','readme.md'];
            let readmePath = null;
            for (const p of candidates) {
              if (fs.existsSync(p)) { readmePath = p; break; }
            }
            if (!readmePath) {
              core.setFailed('README file not found (tried: ' + candidates.join(', ') + ')');
              process.exit(1);
            }

            let md = fs.readFileSync(readmePath, 'utf8');

            // --- Helpers for flexible markers ---
            function findMarkerPositions(tag) {
              const startRe = new RegExp(`<!--\\s*${tag}\\s*:\\s*START\\s*-->`, 'i');
              const endRe   = new RegExp(`<!--\\s*${tag}\\s*:\\s*END\\s*-->`, 'i');
              const startMatch = md.match(startRe);
              const endMatch   = md.match(endRe);
              return { startRe, endRe, startMatch, endMatch };
            }

            function ensureSection(tag, title) {
              let { startRe, endRe, startMatch, endMatch } = findMarkerPositions(tag);
              if (!startMatch || !endMatch) {
                // Append a clean section at the end
                const block = `\\n\\n## ${title}\\n<!-- ${tag}:START -->\\n<!-- ${tag}:END -->\\n`;
                md += block;
                // Refresh matches after appending
                ({ startRe, endRe, startMatch, endMatch } = findMarkerPositions(tag));
              }
              return { startRe, endRe, startMatch, endMatch };
            }

            // Ensure both sections exist (create if missing)
            const act = ensureSection('ACTIVITY', '🔄 Latest activity');
            const star = ensureSection('STARS', '⭐ Recently starred');

            // --- Utilities ---
            function fmtDate(iso) { return iso ? iso.split('T')[0] : ''; }
            const username = process.env.TARGET_USERNAME || context.repo.owner;

            // --- Fetch data ---
            const { data: events } = await github.rest.activity.listPublicEventsForUser({
              username,
              per_page: 5
            }).catch(() => ({ data: [] }));

            const activity = (events || []).map(e => {
              const date = fmtDate(e.created_at);
              const repo = e.repo ? e.repo.name : '';
              const url = repo ? `https://github.com/${repo}` : '';
              const type = e.type || 'Event';
              return `- ${date} — **${type}** in [${repo}](${url})`;
            }).join('\\n') || '- No recent public activity.';

            const { data: stars } = await github.rest.activity.listReposStarredByUser({
              username,
              per_page: 5
            }).catch(() => ({ data: [] }));

            const starred = (stars || []).map(s => {
              const r = s.repo || s;
              const full = r.full_name || (r.owner?.login && r.name ? `${r.owner.login}/${r.name}` : '');
              const desc = (r.description || '').replace(/\\r?\\n/g, ' ').trim();
              return `- [${full}](https://github.com/${full}) — ${desc}`;
            }).join('\\n') || '- No recent stars.';

            // --- Replace content between flexible markers ---
            function replaceBetween(tagObj, newContent) {
              const startMatch = tagObj.startMatch;
              const endMatch = tagObj.endMatch;
              const startIdx = startMatch.index;
              const endIdx = endMatch.index + endMatch[0].length;
              const before = md.slice(0, startIdx + startMatch[0].length);
              const after  = md.slice(endIdx);
              md = `${before}\\n${newContent}\\n${after}`;
            }

            replaceBetween(act, activity);
            replaceBetween(star, starred);

            fs.writeFileSync(readmePath, md);

      - name: Commit & push if changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(readme): update activity & stars (automated)"
            git push
          else
            echo "No changes to commit."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
