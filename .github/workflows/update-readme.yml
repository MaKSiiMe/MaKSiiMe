name: Update profile README (activity + stars)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"  # 05:00 UTC daily (~07:00 Europe/Paris)

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    env:
      TARGET_USERNAME: ${{ github.repository_owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build sections with GitHub API
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const candidates = ['README.md','Readme.md','README.MD','readme.md'];
            let readmePath = candidates.find(p => fs.existsSync(p));
            if (!readmePath) {
              core.setFailed('README file not found.');
              process.exit(1);
            }

            // Ensure ACTIVITY section exists
            function ensureSection(tag, title, md) {
              const startMarker = `<!-- ${tag}:START -->`;
              const endMarker = `<!-- ${tag}:END -->`;
              if (!md.toLowerCase().includes(startMarker.toLowerCase()) ||
                  !md.toLowerCase().includes(endMarker.toLowerCase())) {
                md += `\n\n## ${title}\n${startMarker}\n${endMarker}\n`;
                fs.writeFileSync(readmePath, md);
              }
            }

            let md = fs.readFileSync(readmePath, 'utf8');
            ensureSection('ACTIVITY', '🔄 Latest activity', md);
            md = fs.readFileSync(readmePath, 'utf8');

            const username = process.env.TARGET_USERNAME || context.repo.owner;

            // Date format in Paris time, English output
            function fmtDate(iso) {
              return new Date(iso).toLocaleDateString('en-US', {
                timeZone: 'Europe/Paris',
                month: 'short', day: 'numeric', year: 'numeric'
              });
            }

            const typeIcon = {
              WatchEvent: '👀 Watched',
              CreateEvent: '🆕 Created',
              PushEvent: '📤 Pushed',
              ForkEvent: '🍴 Forked',
              IssuesEvent: '🐞 Issue',
              IssueCommentEvent: '💬 Issue comment',
              PullRequestEvent: '🔀 PR',
              PullRequestReviewEvent: '📝 PR review',
              ReleaseEvent: '🏷️ Release',
              PublicEvent: '🌐 Public',
              StarredEvent: '⭐ Starred'
            };

            // Fetch recent public events
            const { data: eventsRaw } = await github.rest.activity.listPublicEventsForUser({
              username,
              per_page: 50
            }).catch(() => ({ data: [] }));

            // Fetch recent stars with starred_at timestamps
            const { data: starsRaw } = await github.rest.activity.listReposStarredByUser({
              username,
              per_page: 50,
              headers: { accept: 'application/vnd.github.v3.star+json' }
            }).catch(() => ({ data: [] }));

            const eventItems = (eventsRaw || []).map(e => ({
              type: e.type,                           // e.g. 'PushEvent'
              repo: e.repo?.name || '',
              url: e.repo ? `https://github.com/${e.repo.name}` : '',
              date: e.created_at,
              desc: ''
            }));

            const starItems = (starsRaw || []).map(s => {
              const r = s.repo || s;
              const full = r.full_name || (r.owner?.login && r.name ? `${r.owner.login}/${r.name}` : '');
              const desc = (r.description || '').replace(/\r?\n/g, ' ').trim();
              const starredAt = s.starred_at || r.starred_at || r.pushed_at || r.updated_at || r.created_at;
              return {
                type: 'StarredEvent',
                repo: full,
                url: full ? `https://github.com/${full}` : '',
                date: starredAt,
                desc
              };
            });

            // Merge & sort newest first
            const merged = [...eventItems, ...starItems]
              .filter(x => x.repo && x.url && x.date)
              .sort((a,b) => new Date(b.date) - new Date(a.date));

            // Build final list with caps/filters
            const maxItems = 10;
            const capPerRepo = 2;
            const capPerType = 2;
            const perRepo = {};
            const perType = {};
            const seenCombos = new Set();  // prevent same type+repo appearing twice

            const out = [];
            for (const it of merged) {
              const comboKey = `${it.type}-${it.repo}`;
              if ((perRepo[it.repo] || 0) >= capPerRepo) continue;
              if ((perType[it.type] || 0) >= capPerType) continue;
              if (seenCombos.has(comboKey)) continue;

              perRepo[it.repo] = (perRepo[it.repo] || 0) + 1;
              perType[it.type] = (perType[it.type] || 0) + 1;
              seenCombos.add(comboKey);

              const label = typeIcon[it.type] || it.type.replace('Event','');
              const desc = it.type === 'StarredEvent' && it.desc ? ` — ${it.desc}` : '';
              out.push(`- 📅 ${fmtDate(it.date)} — ${label} [${it.repo}](${it.url})${desc}`);

              if (out.length >= maxItems) break;
            }

            const content = out.length ? out.join('\n') : '- No recent public activity.';

            // Replace inside ACTIVITY markers
            const re = /(<!--\s*ACTIVITY:START\s*-->)([\s\S]*?)(<!--\s*ACTIVITY:END\s*-->)/i;
            md = md.replace(re, `$1\n${content}\n$3`);
            fs.writeFileSync(readmePath, md);

      - name: Commit & push if changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(readme): pretty latest activity (no dupes, bullets)"
            git push
          else
            echo "No changes to commit."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
