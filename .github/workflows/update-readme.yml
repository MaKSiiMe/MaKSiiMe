name: Update profile README (latest activity)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"  # 05:00 UTC every day (~06:00/07:00 Europe/Paris)

concurrency:
  group: update-readme-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    env:
      TARGET_USERNAME: ${{ github.repository_owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build clean latest activity
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Locate README
            const candidates = ['README.md','Readme.md','README.MD','readme.md'];
            const readmePath = candidates.find(p => fs.existsSync(p));
            if (!readmePath) { core.setFailed('README file not found.'); process.exit(1); }
            core.exportVariable('README_PATH', readmePath);

            // Ensure ACTIVITY section exists
            function ensureSection(tag, title, md) {
              const start = `<!-- ${tag}:START -->`;
              const end   = `<!-- ${tag}:END -->`;
              if (!md.toLowerCase().includes(start.toLowerCase()) || !md.toLowerCase().includes(end.toLowerCase())) {
                const detailsStart = `<details>\n<summary>📌 <b>${title}</b> (Click to expand)</summary>\n<br/>\n`;
                const detailsEnd = `\n</details>`;
                md += `\n\n${detailsStart}${start}\n${end}${detailsEnd}\n`;
                fs.writeFileSync(readmePath, md);
              }
            }
            let md = fs.readFileSync(readmePath, 'utf8');
            ensureSection('ACTIVITY', 'Recent Activity Log', md);
            md = fs.readFileSync(readmePath, 'utf8');

            const username = process.env.TARGET_USERNAME || context.repo.owner;

            const typeIcon = {
              CreateEvent: '🆕 Created',
              PushEvent:   '📤 Pushed',
              ForkEvent:   '🍴 Forked',
              IssuesEvent: '🐞 Issue',
              IssueCommentEvent: '💬 Issue comment',
              PullRequestEvent: '🔀 PR',
              PullRequestReviewEvent: '📝 PR review',
              ReleaseEvent: '🏷️ Release',
              PublicEvent: '🌐 Public',
              StarredEvent: '⭐ Starred'
            };

            function formatRepo(repoFullName) {
              if (!repoFullName) return '';
              return repoFullName.startsWith(`${username}/`)
                ? `🔥 ${repoFullName}`
                : repoFullName;
            }

            function fmtDate(iso) {
              return new Date(iso).toLocaleDateString('en-US', {
                timeZone: 'Europe/Paris',
                month: 'short', day: 'numeric', year: 'numeric'
              });
            }

            let hadApiFailure = false;

            // Fetch recent events
            let eventsRaw = [];
            try {
              const { data } = await github.rest.activity.listPublicEventsForUser({
                username,
                per_page: 50
              });
              eventsRaw = data || [];
            } catch (err) {
              hadApiFailure = true;
              core.warning(`Failed to fetch public events: ${err.message || err}`);
            }

            // Fetch recent stars
            let starsRaw = [];
            try {
              const { data } = await github.rest.activity.listReposStarredByUser({
                username,
                per_page: 50,
                headers: { accept: 'application/vnd.github.v3.star+json' }
              });
              starsRaw = data || [];
            } catch (err) {
              hadApiFailure = true;
              core.warning(`Failed to fetch starred repositories: ${err.message || err}`);
            }

            // If APIs failed and no data is available, keep current README content.
            if (hadApiFailure && eventsRaw.length === 0 && starsRaw.length === 0) {
              core.warning('Skipping README update to avoid overwriting activity with fallback content.');
              return;
            }

            const eventItems = (eventsRaw || []).map(e => ({
              type: e.type,
              repo: e.repo?.name || '',
              url: e.repo?.name ? `https://github.com/${e.repo.name}` : '',
              date: e.created_at
            }));

            const starItems = (starsRaw || []).map(s => {
              const r = s.repo || s;
              const full = r.full_name || '';
              const starredAt = s.starred_at || r.updated_at || r.created_at;
              return {
                type: 'StarredEvent',
                repo: full,
                url: `https://github.com/${full}`,
                date: starredAt
              };
            });

            // Merge & sort currently available activity items
            let merged = [...eventItems, ...starItems]
              .filter(x => x.repo && x.url && x.date)
              .sort((a,b) => new Date(b.date) - new Date(a.date));

            // Caps & de-dup: 10 max, ≤2 per repo, ≤2 per type
            const maxItems = 10;
            const capPerRepo = 2;
            const capPerType = 2;
            const perRepo = {};
            const perType = {};
            const seenCombos = new Set();

            const lines = [];
            for (const it of merged) {
              const comboKey = `${it.type}-${it.repo}`;
              if ((perRepo[it.repo] || 0) >= capPerRepo) continue;
              if ((perType[it.type] || 0) >= capPerType) continue;
              if (seenCombos.has(comboKey)) continue;

              perRepo[it.repo] = (perRepo[it.repo] || 0) + 1;
              perType[it.type] = (perType[it.type] || 0) + 1;
              seenCombos.add(comboKey);

              const label = typeIcon[it.type] || it.type.replace('Event','');
              const repoFmt = formatRepo(it.repo);
              lines.push(`- ${fmtDate(it.date)} — ${label} [${repoFmt}](${it.url})`);

              if (lines.length >= maxItems) break;
            }

            const contentBlock = lines.length ? '\n' + lines.join('\n') + '\n' : '\n- No recent public activity.\n';
            const re = /(<!--\s*ACTIVITY:START\s*-->)([\s\S]*?)(<!--\s*ACTIVITY:END\s*-->)/i;
            md = md.replace(re, `$1${contentBlock}$3`);
            fs.writeFileSync(readmePath, md);

      - name: Commit & push if changed
        run: |
          readme_path="${README_PATH:-README.md}"
          if [[ -n "$(git status --porcelain -- "$readme_path")" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$readme_path"
            git commit -m "chore(readme): update recent activity"
            git push
          else
            echo "No changes to commit."
          fi
