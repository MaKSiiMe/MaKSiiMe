name: Update profile README (latest activity – enhanced)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"  # 05:00 UTC daily (~07:00 Europe/Paris)

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    env:
      TARGET_USERNAME: ${{ github.repository_owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build enhanced latest activity
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // --- Locate README (any casing)
            const candidates = ['README.md','Readme.md','README.MD','readme.md'];
            const readmePath = candidates.find(p => fs.existsSync(p));
            if (!readmePath) { core.setFailed('README file not found.'); process.exit(1); }

            // --- Ensure ACTIVITY section exists (exact markers)
            function ensureSection(tag, title, md) {
              const start = `<!-- ${tag}:START -->`;
              const end   = `<!-- ${tag}:END -->`;
              if (!md.toLowerCase().includes(start.toLowerCase()) || !md.toLowerCase().includes(end.toLowerCase())) {
                md += `\n\n## ${title}\n${start}\n${end}\n`;
                fs.writeFileSync(readmePath, md);
              }
            }
            let md = fs.readFileSync(readmePath, 'utf8');
            ensureSection('ACTIVITY', '🔄 Latest activity', md);
            md = fs.readFileSync(readmePath, 'utf8');

            // --- Helpers
            const username = process.env.TARGET_USERNAME || context.repo.owner;

            const typeIcon = {
              WatchEvent: '👀 Watched',
              CreateEvent: '🆕 Created',
              PushEvent:   '📤 Pushed',
              ForkEvent:   '🍴 Forked',
              IssuesEvent: '🐞 Issue',
              IssueCommentEvent: '💬 Issue comment',
              PullRequestEvent: '🔀 PR',
              PullRequestReviewEvent: '📝 PR review',
              ReleaseEvent: '🏷️ Release',
              PublicEvent: '🌐 Public',
              StarredEvent: '⭐ Starred'
            };

            // Domain emoji from repo name
            function domainEmoji(repoFullName = '') {
              const r = repoFullName.toLowerCase();
              if (/(ml|machine[_-]?learning|pytorch|gymnasium|torch|ai|manim)/.test(r)) return '🧠';
              if (/(web3|solidity|hardhat|foundry|wallet|eth|ethereum|bittensor|fhevm)/.test(r)) return '⛓️';
              if (/(data|analytics|indicator|stats)/.test(r)) return '📊';
              return '📁';
            }

            // Bold + fire for own repos
            function formatRepo(repoFullName) {
              if (!repoFullName) return '';
              return repoFullName.startsWith(`${username}/`)
                ? `**🔥 ${repoFullName}**`
                : repoFullName;
            }

            // Date format in Paris time, English output
            function fmtDate(iso) {
              return new Date(iso).toLocaleDateString('en-US', {
                timeZone: 'Europe/Paris',
                month: 'short', day: 'numeric', year: 'numeric'
              });
            }

            // Truncate text to n chars
            function trunc(s, n=80) {
              if (!s) return '';
              const t = s.replace(/\r?\n/g, ' ').trim();
              return t.length > n ? t.slice(0, n-1) + '…' : t;
            }

            // --- Fetch recent public events
            const { data: eventsRaw } = await github.rest.activity.listPublicEventsForUser({
              username,
              per_page: 50
            }).catch(() => ({ data: [] }));

            // --- Fetch stars with starred_at timestamps
            const { data: starsRaw } = await github.rest.activity.listReposStarredByUser({
              username,
              per_page: 50,
              headers: { accept: 'application/vnd.github.v3.star+json' }
            }).catch(() => ({ data: [] }));

            // Transform events
            const eventItems = (eventsRaw || []).map(e => {
              const repo = e.repo?.name || '';
              // For pushes, try to link the most recent commit
              let url = repo ? `https://github.com/${repo}` : '';
              if (e.type === 'PushEvent' && e.payload?.commits?.length && repo) {
                const last = e.payload.commits[e.payload.commits.length - 1];
                const sha = (last && last.sha) ? last.sha : null;
                if (sha) url = `https://github.com/${repo}/commit/${sha}`;
              }
              return {
                kind: 'event',
                type: e.type,
                repo,
                url,
                date: e.created_at,
                desc: '',
              };
            });

            // Transform stars
            const starItems = (starsRaw || []).map(s => {
              const r = s.repo || s;
              const full = r.full_name || (r.owner?.login && r.name ? `${r.owner.login}/${r.name}` : '');
              const starredAt = s.starred_at || r.starred_at || r.pushed_at || r.updated_at || r.created_at;
              return {
                kind: 'star',
                type: 'StarredEvent',
                repo: full,
                url: full ? `https://github.com/${full}` : '',
                date: starredAt,
                desc: trunc(r.description || '', 80),
              };
            });

            // Merge, filter by date window (30 days), sort desc
            const now = Date.now();
            const THIRTY_DAYS_MS = 30 * 24 * 60 * 60 * 1000;
            let merged = [...eventItems, ...starItems]
              .filter(x => x.repo && x.url && x.date)
              .sort((a,b) => new Date(b.date) - new Date(a.date));

            const recent = merged.filter(x => (now - new Date(x.date).getTime()) <= THIRTY_DAYS_MS);
            if (recent.length) merged = recent; // prefer last 30 days; else keep general latest

            // Build final list with caps/filters
            const maxItems = 10;
            const capPerRepo = 2;
            const capPerType = 2;
            const perRepo = {};
            const perType = {};
            const seenCombos = new Set(); // avoid same type+repo twice in the list

            const out = [];
            for (const it of merged) {
              const comboKey = `${it.type}-${it.repo}`;
              if ((perRepo[it.repo] || 0) >= capPerRepo) continue;
              if ((perType[it.type] || 0) >= capPerType) continue;
              if (seenCombos.has(comboKey)) continue;

              perRepo[it.repo] = (perRepo[it.repo] || 0) + 1;
              perType[it.type] = (perType[it.type] || 0) + 1;
              seenCombos.add(comboKey);

              const label = typeIcon[it.type] || it.type.replace('Event','');
              const dom = domainEmoji(it.repo);
              const repoFmt = formatRepo(it.repo);
              const desc = (it.type === 'StarredEvent' && it.desc) ? ` — ${it.desc}` : '';
              out.push(`- 📅 ${fmtDate(it.date)} — ${label} ${dom} [${repoFmt}](${it.url})${desc}`);

              if (out.length >= maxItems) break;
            }

            const content = out.length ? out.join('\n') : '- No recent public activity.';

            // Replace inside ACTIVITY markers
            const re = /(<!--\s*ACTIVITY:START\s*-->)([\s\S]*?)(<!--\s*ACTIVITY:END\s*-->)/i;
            md = md.replace(re, `$1\n${content}\n$3`);
            fs.writeFileSync(readmePath, md);

      - name: Commit & push if changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(readme): enhanced latest activity (events+stars, caps, domain emojis, own repos)"
            git push
          else
            echo "No changes to commit."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
