name: Update profile README (activity + stars merged)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"  # 05:00 UTC daily (~07:00 Europe/Paris)

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    env:
      TARGET_USERNAME: ${{ github.repository_owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build merged activity section
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Detect README file regardless of casing
            const candidates = ['README.md','Readme.md','README.MD','readme.md'];
            let readmePath = candidates.find(p => fs.existsSync(p));
            if (!readmePath) {
              core.setFailed('README file not found.');
              process.exit(1);
            }

            // Ensure ACTIVITY section exists
            function ensureSection(tag, title, md) {
              const startMarker = `<!-- ${tag}:START -->`;
              const endMarker = `<!-- ${tag}:END -->`;
              if (!md.toLowerCase().includes(startMarker.toLowerCase()) || !md.toLowerCase().includes(endMarker.toLowerCase())) {
                md += `\n\n## ${title}\n${startMarker}\n${endMarker}\n`;
                fs.writeFileSync(readmePath, md);
              }
            }

            let md = fs.readFileSync(readmePath, 'utf8');
            ensureSection('ACTIVITY', '🔄 Latest activity', md);
            md = fs.readFileSync(readmePath, 'utf8');

            // Helpers
            function fmtDate(iso) { return iso ? iso.split('T')[0] : ''; }
            const username = process.env.TARGET_USERNAME || context.repo.owner;

            const typeIcon = {
              WatchEvent: '👀 Watched',
              CreateEvent: '🆕 Created',
              PushEvent: '📤 Pushed',
              ForkEvent: '🍴 Forked',
              IssuesEvent: '🐞 Issue',
              IssueCommentEvent: '💬 Issue comment',
              PullRequestEvent: '🔀 PR',
              PullRequestReviewEvent: '📝 PR review',
              ReleaseEvent: '🏷️ Release',
              PublicEvent: '🌐 Public',
              Starred: '⭐ Starred'
            };

            // Fetch raw events
            const { data: eventsRaw } = await github.rest.activity.listPublicEventsForUser({
              username,
              per_page: 30
            }).catch(() => ({ data: [] }));

            const events = (eventsRaw || []).map(e => ({
              date: e.created_at,
              repo: e.repo?.name || '',
              url: e.repo ? `https://github.com/${e.repo.name}` : '',
              type: e.type.replace('Event',''),
              desc: ''
            }));

            // Fetch raw stars
            const { data: starsRaw } = await github.rest.activity.listReposStarredByUser({
              username,
              per_page: 30
            }).catch(() => ({ data: [] }));

            const stars = (starsRaw || []).map(s => {
              const r = s.repo || s;
              return {
                date: s.starred_at || r.created_at,
                repo: r.full_name || '',
                url: `https://github.com/${r.full_name}`,
                type: 'Starred',
                desc: (r.description || '').replace(/\r?\n/g, ' ').trim()
              };
            });

            // Merge & sort
            const merged = [...events, ...stars].sort((a,b) => new Date(b.date) - new Date(a.date));

            // Apply filters: max 10 total, max 2 per repo, max 2 per type
            const maxItems = 10;
            const maxPerRepo = 2;
            const maxPerType = 2;
            const countPerRepo = {};
            const countPerType = {};
            const finalList = [];

            for (const item of merged) {
              if (!item.repo || !item.url) continue;
              if ((countPerRepo[item.repo] || 0) >= maxPerRepo) continue;
              if ((countPerType[item.type] || 0) >= maxPerType) continue;

              countPerRepo[item.repo] = (countPerRepo[item.repo] || 0) + 1;
              countPerType[item.type] = (countPerType[item.type] || 0) + 1;

              const label = typeIcon[item.type+'Event'] || typeIcon[item.type] || item.type;
              const descPart = item.desc ? ` — ${item.desc}` : '';
              finalList.push(`- 📅 ${fmtDate(item.date)} — ${label} [${item.repo}](${item.url})${descPart}`);

              if (finalList.length >= maxItems) break;
            }

            const activityContent = finalList.length ? finalList.join('\n') : '- No recent activity.';

            // Replace between markers
            function replaceBetween(md, tag, newContent) {
              const re = new RegExp(`(<!--\\s*${tag}:START\\s*-->)([\\s\\S]*?)(<!--\\s*${tag}:END\\s*-->)`, 'i');
              return md.replace(re, `$1\n${newContent}\n$3`);
            }

            md = replaceBetween(md, 'ACTIVITY', activityContent);
            fs.writeFileSync(readmePath, md);

      - name: Commit & push if changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(readme): update merged activity (events + stars)"
            git push
          else
            echo "No changes to commit."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
