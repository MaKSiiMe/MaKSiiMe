name: Update profile README (activity only)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"  # 05:00 UTC daily (~07:00 Europe/Paris)

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    env:
      TARGET_USERNAME: ${{ github.repository_owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build activity section with GitHub API
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Detect README file regardless of casing
            const candidates = ['README.md','Readme.md','README.MD','readme.md'];
            let readmePath = candidates.find(p => fs.existsSync(p));
            if (!readmePath) {
              core.setFailed('README file not found.');
              process.exit(1);
            }

            // Ensure ACTIVITY section exists
            function ensureSection(tag, title, md) {
              const startMarker = `<!-- ${tag}:START -->`;
              const endMarker = `<!-- ${tag}:END -->`;
              if (!md.toLowerCase().includes(startMarker.toLowerCase()) || !md.toLowerCase().includes(endMarker.toLowerCase())) {
                md += `\n\n## ${title}\n${startMarker}\n${endMarker}\n`;
                fs.writeFileSync(readmePath, md);
              }
            }

            let md = fs.readFileSync(readmePath, 'utf8');
            ensureSection('ACTIVITY', '🔄 Latest activity', md);
            md = fs.readFileSync(readmePath, 'utf8');

            // Format date
            function fmtDate(iso) { return iso ? iso.split('T')[0] : ''; }
            const username = process.env.TARGET_USERNAME || context.repo.owner;

            // Icons for event types
            const typeIcon = {
              WatchEvent: '👀 Watched',
              CreateEvent: '🆕 Created',
              PushEvent: '📤 Pushed',
              ForkEvent: '🍴 Forked',
              IssuesEvent: '🐞 Issue',
              IssueCommentEvent: '💬 Issue comment',
              PullRequestEvent: '🔀 PR',
              PullRequestReviewEvent: '📝 PR review',
              ReleaseEvent: '🏷️ Release',
              PublicEvent: '🌐 Public',
              StarEvent: '⭐ Starred'
            };

            // Fetch last events
            const { data: eventsRaw } = await github.rest.activity.listPublicEventsForUser({
              username,
              per_page: 30
            }).catch(() => ({ data: [] }));

            // Transform + deduplicate
            const seen = new Set();
            const events = [];

            for (const e of eventsRaw || []) {
              const date = fmtDate(e.created_at);
              const repo = e.repo ? e.repo.name : '';
              const url = repo ? `https://github.com/${repo}` : '';
              const label = typeIcon[e.type] || e.type || 'Event';
              const line = `- 📅 ${date} — ${label} [${repo}](${url})`;
              const key = `${date}-${label}-${repo}`;
              if (!seen.has(key)) {
                seen.add(key);
                events.push(line);
              }
              if (events.length >= 10) break;
            }

            const activityContent = events.length ? events.join('\n') : '- No recent public activity.';

            // Replace ACTIVITY section content
            function replaceBetween(md, tag, newContent) {
              const re = new RegExp(`(<!--\\s*${tag}:START\\s*-->)([\\s\\S]*?)(<!--\\s*${tag}:END\\s*-->)`, 'i');
              return md.replace(re, `$1\n${newContent}\n$3`);
            }

            md = replaceBetween(md, 'ACTIVITY', activityContent);
            fs.writeFileSync(readmePath, md);

      - name: Commit & push if changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(readme): update latest activity (no duplicates)"
            git push
          else
            echo "No changes to commit."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
