name: Update profile README (activity + stars)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"  # 05:00 UTC daily (~07:00 Europe/Paris)

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    env:
      TARGET_USERNAME: ${{ github.repository_owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build sections with GitHub API (robust markers & clean formatting)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Detect README file regardless of casing
            const candidates = ['README.md','Readme.md','README.MD','readme.md'];
            let readmePath = candidates.find(p => fs.existsSync(p));
            if (!readmePath) {
              core.setFailed('README file not found.');
              process.exit(1);
            }

            // Helper to ensure section exists exactly matching regex
            function ensureSection(tag, title, md) {
              const startMarker = `<!-- ${tag}:START -->`;
              const endMarker = `<!-- ${tag}:END -->`;
              const hasStart = md.toLowerCase().includes(startMarker.toLowerCase());
              const hasEnd = md.toLowerCase().includes(endMarker.toLowerCase());
              if (!hasStart || !hasEnd) {
                md += `\n\n## ${title}\n${startMarker}\n${endMarker}\n`;
                fs.writeFileSync(readmePath, md);
              }
            }

            // Step 1: Ensure sections exist in README
            let md = fs.readFileSync(readmePath, 'utf8');
            ensureSection('ACTIVITY', '🔄 Latest activity', md);
            md = fs.readFileSync(readmePath, 'utf8');
            ensureSection('STARS', '⭐ Recently starred', md);
            md = fs.readFileSync(readmePath, 'utf8'); // Reload after any changes

            // Utilities
            function fmtDate(iso) { return iso ? iso.split('T')[0] : ''; }
            const username = process.env.TARGET_USERNAME || context.repo.owner;

            // Friendly labels for events
            const typeIcon = {
              WatchEvent: '👀 Watched',
              CreateEvent: '🆕 Created',
              PushEvent: '📤 Pushed',
              ForkEvent: '🍴 Forked',
              IssuesEvent: '🐞 Issue',
              IssueCommentEvent: '💬 Issue comment',
              PullRequestEvent: '🔀 PR',
              PullRequestReviewEvent: '📝 PR review',
              ReleaseEvent: '🏷️ Release',
              PublicEvent: '🌐 Public'
            };

            // Fetch last 3 events
            const { data: eventsRaw } = await github.rest.activity.listPublicEventsForUser({
              username,
              per_page: 10
            }).catch(() => ({ data: [] }));

            const events = (eventsRaw || []).slice(0, 3).map(e => {
              const date = fmtDate(e.created_at);
              const repo = e.repo ? e.repo.name : '';
              const url = repo ? `https://github.com/${repo}` : '';
              const label = typeIcon[e.type] || e.type || 'Event';
              return `- 📅 ${date} — ${label} [${repo}](${url})`;
            });

            // Fetch last 3 starred repos
            const { data: starsRaw } = await github.rest.activity.listReposStarredByUser({
              username,
              per_page: 10
            }).catch(() => ({ data: [] }));

            const stars = (starsRaw || []).slice(0, 3).map(s => {
              const r = s.repo || s;
              const full = r.full_name || (r.owner?.login && r.name ? `${r.owner.login}/${r.name}` : '');
              const desc = (r.description || '').replace(/\r?\n/g, ' ').trim();
              return desc
                ? `- ⭐ [${full}](https://github.com/${full}) — ${desc}`
                : `- ⭐ [${full}](https://github.com/${full})`;
            });

            const activityContent = events.length ? events.join('\n') : '- No recent public activity.';
            const starsContent = stars.length ? stars.join('\n') : '- No recent stars.';

            // Replace content between markers
            function replaceBetween(md, tag, newContent) {
              const re = new RegExp(`(<!--\\s*${tag}:START\\s*-->)([\\s\\S]*?)(<!--\\s*${tag}:END\\s*-->)`, 'i');
              return md.replace(re, `$1\n${newContent}\n$3`);
            }

            md = replaceBetween(md, 'ACTIVITY', activityContent);
            md = replaceBetween(md, 'STARS', starsContent);

            fs.writeFileSync(readmePath, md);

      - name: Commit & push if changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(readme): update activity & stars (robust formatting)"
            git push
          else
            echo "No changes to commit."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
