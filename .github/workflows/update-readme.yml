name: Update profile README (activity + stars)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"  # 05:00 UTC daily (~07:00 Europe/Paris)

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    env:
      TARGET_USERNAME: ${{ github.repository_owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build sections with GitHub API
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const candidates = ['README.md','Readme.md','README.MD','readme.md'];
            let readmePath = candidates.find(p => fs.existsSync(p));
            if (!readmePath) {
              core.setFailed('README file not found.');
              process.exit(1);
            }

            function ensureSection(tag, title, md) {
              const startMarker = `<!-- ${tag}:START -->`;
              const endMarker = `<!-- ${tag}:END -->`;
              if (!md.toLowerCase().includes(startMarker.toLowerCase()) ||
                  !md.toLowerCase().includes(endMarker.toLowerCase())) {
                md += `\n\n## ${title}\n${startMarker}\n${endMarker}\n`;
                fs.writeFileSync(readmePath, md);
              }
            }

            let md = fs.readFileSync(readmePath, 'utf8');
            ensureSection('ACTIVITY', '🔄 Latest activity', md);
            md = fs.readFileSync(readmePath, 'utf8');

            function fmtDate(iso) {
              const date = new Date(iso);
              return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            }
            const username = process.env.TARGET_USERNAME || context.repo.owner;

            const typeIcon = {
              WatchEvent: '👀 Watched',
              CreateEvent: '🆕 Created',
              PushEvent: '📤 Pushed',
              ForkEvent: '🍴 Forked',
              IssuesEvent: '🐞 Issue',
              IssueCommentEvent: '💬 Issue comment',
              PullRequestEvent: '🔀 PR',
              PullRequestReviewEvent: '📝 PR review',
              ReleaseEvent: '🏷️ Release',
              PublicEvent: '🌐 Public',
              StarredEvent: '⭐ Starred'
            };

            const { data: eventsRaw } = await github.rest.activity.listPublicEventsForUser({
              username,
              per_page: 50
            }).catch(() => ({ data: [] }));

            const { data: starsRaw } = await github.rest.activity.listReposStarredByUser({
              username,
              per_page: 10
            }).catch(() => ({ data: [] }));

            const starEvents = (starsRaw || []).map(s => {
              const r = s.repo || s;
              const full = r.full_name || `${r.owner?.login}/${r.name}`;
              const desc = (r.description || '').replace(/\r?\n/g, ' ').trim();
              return {
                type: 'StarredEvent',
                repo: full,
                date: s.starred_at || s.created_at || new Date().toISOString(),
                desc
              };
            });

            const allItems = [
              ...(eventsRaw || []).map(e => ({
                type: e.type,
                repo: e.repo?.name,
                date: e.created_at,
                desc: ''
              })),
              ...starEvents
            ].sort((a, b) => new Date(b.date) - new Date(a.date));

            const maxItems = 10;
            const capPerRepo = 2;
            const capPerType = 2;
            const perRepo = {};
            const perType = {};
            const seenCombos = new Set();

            const finalList = [];
            for (const it of allItems) {
              if (!it.repo) continue;
              const comboKey = `${it.type}-${it.repo}`;
              if ((perRepo[it.repo] || 0) >= capPerRepo) continue;
              if ((perType[it.type] || 0) >= capPerType) continue;
              if (seenCombos.has(comboKey)) continue;

              perRepo[it.repo] = (perRepo[it.repo] || 0) + 1;
              perType[it.type] = (perType[it.type] || 0) + 1;
              seenCombos.add(comboKey);

              const label = typeIcon[it.type] || it.type || 'Event';
              if (it.type === 'StarredEvent' && it.desc) {
                finalList.push(`📅 ${fmtDate(it.date)} — ${label} [${it.repo}](https://github.com/${it.repo}) — ${it.desc}`);
              } else {
                finalList.push(`📅 ${fmtDate(it.date)} — ${label} [${it.repo}](https://github.com/${it.repo})`);
              }

              if (finalList.length >= maxItems) break;
            }

            const activityContent = finalList.length ? finalList.join('\n') : '- No recent public activity.';

            function replaceBetween(md, tag, newContent) {
              const re = new RegExp(`(<!--\\s*${tag}:START\\s*-->)([\\s\\S]*?)(<!--\\s*${tag}:END\\s*-->)`, 'i');
              return md.replace(re, `$1\n${newContent}\n$3`);
            }

            md = replaceBetween(md, 'ACTIVITY', activityContent);
            fs.writeFileSync(readmePath, md);

      - name: Commit & push if changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(readme): update latest activity (filtered duplicates)"
            git push
          else
            echo "No changes to commit."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
